app:
  name: aia-rag
  env: dev

llm:
  provider: openai
  model: gpt-4o-mini
  temperature: 0.1

embedding:
  provider: openai
  model: text-embedding-3-small

retrieval:
  mode: hybrid
  top_k: 5
  score_threshold: 0.55
  max_distance: 20.0
  enable_reranker: true
  vector_weight: 0.6
  keyword_weight: 0.4
  rerank_hybrid_score_weight: 0.7
  rerank_keyword_score_weight: 0.2
  rerank_vector_rank_weight: 0.1


vector_store:
  provider: chroma
  persist_directory: ./data/chroma
  collection_name: internal_kb

logging:
  path: ./logs/rag_service.jsonl

cache:
  enabled: true
  ttl_seconds: 300