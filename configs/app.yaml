app:
  name: aia-rag
  env: dev

generator:
  type: llm
  fallback_type: extractive

llm:
  provider: bailian
  model: qwen-plus
  temperature: 0.1
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1

# llm:
#   provider: openai
#   model: gpt-4o-mini
#   temperature: 0.1

embedding:
  provider: openai
  model: text-embedding-3-small

retrieval:
  mode: hybrid
  top_k: 5
  score_threshold: 0.55
  max_distance: 20.0
  enable_reranker: true
  vector_weight: 0.6
  keyword_weight: 0.4
  rerank_hybrid_score_weight: 0.7
  rerank_keyword_score_weight: 0.2
  rerank_vector_rank_weight: 0.1

context:
  max_context_chunks: 3

vector_store:
  provider: chroma
  persist_directory: ./data/chroma
  collection_name: internal_kb

logging:
  path: ./logs/rag_service.jsonl

cache:
  enabled: true
  ttl_seconds: 300

cost:
  enabled: true
  currency: USD

  # Reference list price for qwen-plus, 0 < input tokens <= 256K, non-thinking mode.
  # Used for PRD-required cost estimation per 1,000 calls.
  input_price_per_1m_tokens: 0.4
  output_price_per_1m_tokens: 1.2

  # Current account may still be using free quota.
  # If true, billable cost is reported as 0 while reference cost is still calculated.
  free_quota_enabled: true